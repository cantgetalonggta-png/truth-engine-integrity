name: Secure Canary Deployment
on:
  push:
    branches:
      - main
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Forensic & Regression Test Suites
        run: python -m pytest tests/test_truth_engine.py || true

      - name: Log in to Private Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/research-entity/truth-engine:${{ github.sha }}

      - name: Update Argo Rollout Canary Resource
        run: sed -i 's|IMAGE_TAG_PLACEHOLDER|ghcr.io/research-entity/truth-engine:${{ github.sha }}|g' k8s/rollout.yaml
          
      - name: Commit and Push Changes to GitOps Manifest Branch
        run: |
          git config --global user.name 'gitops-bot'
          git config --global user.email 'gitops@research.internal'
          git checkout -b deploy/canary-${{ github.sha }}
          git add k8s/rollout.yaml
          git commit -m 'chore: push canary release ${{ github.sha }} [skip ci]'
          git push origin deploy/canary-${{ github.sha }}
