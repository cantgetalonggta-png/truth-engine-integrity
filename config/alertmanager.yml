global:
  resolve_timeout: 5m
route:
  group_by: ['alertname', 'tier']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: 'infra-pagerduty-critical'
  routes:
    - match:
        severity: critical
      receiver: 'infra-pagerduty-critical'
    - match:
        severity: warning
      receiver: 'infra-slack-warnings'

receivers:
- name: 'infra-pagerduty-critical'
  pagerduty_configs:
  - service_key: '${PAGERDUTY_SERVICE_KEY}'
    severity: 'critical'

- name: 'infra-slack-warnings'
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'
    channel: '#infra-alerts-dev'
    text: 'Alert: {{ .CommonAnnotations.summary }}\nDescription: {{ .CommonAnnotations.description }}'
